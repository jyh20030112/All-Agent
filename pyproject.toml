[project]
name = "ejagent-core"
version = "0.6.0"
description = "An OpenAI-first agent harness core for controlled, durable, and observable agent runtimes"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.26.0",
    "openai>=2.41.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "referencing>=0.37.0",
]

[project.urls]
Homepage = "https://github.com/jyh20030112/SimAgentPlg"
Repository = "https://github.com/jyh20030112/SimAgentPlg"
Issues = "https://github.com/jyh20030112/SimAgentPlg/issues"

[project.optional-dependencies]
mcp = [
    "fastmcp>=3.4.2",
]

[dependency-groups]
dev = [
    "mypy>=1.18.2",
    "ruff>=0.14.0",
    "types-jsonschema>=4.26.0.20260518",
    "types-pyyaml>=6.0.12.20250915",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ejagent"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.gitmodules",
    "/pi",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["ASYNC", "B", "E4", "E7", "E9", "F", "I", "UP"]
ignore = [
    "B027",  # Lifecycle base classes intentionally provide optional no-op hooks.
    "UP040", # Preserve runtime-compatible public TypeAlias values.
]

[tool.mypy]
python_version = "3.12"
files = ["src/ejagent"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
warn_redundant_casts = true
warn_unreachable = true
warn_unused_ignores = true
